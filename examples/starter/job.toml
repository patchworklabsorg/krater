# The job's options, for `krater submit -f job.toml` (and `krater run -f job.toml`). Options typed on the command
# line win, so:
#   krater run -f job.toml --smoke          try it on your own computer in Docker, free
#   krater submit -f job.toml --estimate    what it may cost; queues nothing
#   krater submit -f job.toml --smoke       try it on a real GPU for a few cents
#   krater submit -f job.toml               the real run

project = "your-project"            # your project's name or id
name = "starter"

# This folder is uploaded with the job and the command runs inside it, on Krater's PyTorch image: nothing to build.
# A requirements.txt here is installed first.
code = "."
command = "python train.py --minutes 20"
# Your own image instead (see README.md): drop `code` and set
#   image = "ghcr.io/you/krater-starter:v1"
#   command = "cd /app && python train.py --minutes 20"

gpu = ["RTX 3060", "RTX 4060 Ti", "RTX 3090"]   # any of these; cheap and plenty for this model
limit = 0.15                         # a limit order: never pay more than $0.15/h for the GPU
max-runtime = 45                     # minutes; a safety net for a job that hangs
checkpoint-upload = 5                # upload checkpoints every 5 minutes, as often as train.py saves them
data-out = 1                         # GB of results and checkpoints, for the cost estimate
