# Builds the image and pushes it to GitHub Container Registry when you push a tag like v1, v2 ...
#   git tag v1 && git push origin v1
# The image is ghcr.io/<your GitHub name>/<this repository>:v1. Make it public once (the package's settings on GitHub,
# "Change visibility"), because Vast hosts pull it without signing in.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
      - run: echo "Pushed ${{ steps.name.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
