# Paste into api.slack.com/apps -> Create New App -> From an app manifest.
# Replace <public> with the portal's public hostname (or a tunnel URL; see slack-setup.md section 3).
display_information:
  name: Ganymede Review
  description: Project Ganymede proposal review, from Krater.
  background_color: "#6c3ec1"
features:
  bot_user:
    display_name: Ganymede Review
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - groups:write
      - groups:write.invites
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://<public>/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
