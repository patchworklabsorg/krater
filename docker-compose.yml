services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krater}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krater}
      POSTGRES_DB: ${POSTGRES_DB:-krater}
    volumes:
      - krater_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krater} -d ${POSTGRES_DB:-krater}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot deploy setup: database migrations, then the screenshot bucket and its CORS rule (skipped
  # when KRATER_S3_MODE=fake). Both steps are safe to re-run; see docs/dev/storage.md.
  migrate:
    build: .
    env_file: ${KRATER_ENV_FILE:-.env}
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m krater.storage.ensure_bucket"]
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  portal:
    build: .
    restart: unless-stopped
    env_file: ${KRATER_ENV_FILE:-.env}
    # KRATER_BIND_ADDRESS=127.0.0.1 in production keeps the published ports off the network, so the
    # only way in is through the TLS proxy (docs/dev/production.md). Applies to every port below.
    ports:
      - "${KRATER_BIND_ADDRESS:-0.0.0.0}:${PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    restart: unless-stopped
    env_file: ${KRATER_ENV_FILE:-.env}
    command: ["procrastinate", "--app=krater.worker.app.app", "worker"]
    # The Vast key, for Krater Compute (KRATER_COMPUTE_MODE=vast): mounted into the worker only, never the portal.
    # Point KRATER_VAST_KEY_FILE at the key on the host and set KRATER_VAST_API_KEY_FILE=/run/secrets/vast_api_key.
    volumes:
      - ${KRATER_VAST_KEY_FILE:-/dev/null}:/run/secrets/vast_api_key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Temporary self-hosted S3-compatible storage (gallery screenshots) until a real provider is chosen; see
  # docs/SPEC.md "Open questions". SeaweedFS rather than MinIO: MinIO stopped publishing community images in 2025.
  storage:
    # 4.47 is what staging ran (2026-10-10). Bump deliberately, after a staging run on the new version.
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.47}
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${KRATER_S3_ACCESS_KEY_ID:-krater}
      S3_SECRET_KEY: ${KRATER_S3_SECRET_ACCESS_KEY:-krater-dev-secret}
    # The S3 gateway reads its credentials from a JSON file; write it from the env so no secret lives in the repo.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"krater","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "${KRATER_BIND_ADDRESS:-0.0.0.0}:${S3_PORT:-8333}:8333"
    volumes:
      - krater_storage_data:/data

  # -- Production extras (docs/dev/production.md) --------------------------------------------------
  # Opt-in, so dev and staging stay as they are: `--profile backup` and `--profile proxy`.

  # Nightly `pg_dump` of Krater's database: the budget ledger and audit log live only there. Dumps land
  # in KRATER_BACKUP_DIR on the host, which is what to copy off the machine; files older than
  # KRATER_BACKUP_KEEP_DAYS are deleted. Restoring one is in docs/dev/production.md.
  db-backup:
    image: postgres:16
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-krater}
      PGPASSWORD: ${POSTGRES_PASSWORD:-krater}
      PGDATABASE: ${POSTGRES_DB:-krater}
      BACKUP_INTERVAL_SECONDS: ${KRATER_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${KRATER_BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    # A one-item list so the script reaches the shell intact. Each dump is written under a temporary
    # name and renamed when complete, so a half-written file is never mistaken for a good backup.
    command:
      - |
        set -eu
        while true; do
          name="krater-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --file="/backups/$$name.partial"; then
            mv "/backups/$$name.partial" "/backups/$$name"
            echo "backup written: $$name"
          else
            rm -f "/backups/$$name.partial"
            echo "backup FAILED at $$(date -u +%FT%TZ)" >&2
          fi
          find /backups -name 'krater-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - ${KRATER_BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  # TLS in front of the portal and the screenshot bucket, with certificates
  # from Let's Encrypt. Routes are in deploy/Caddyfile. Leave this profile off when the host already
  # runs a reverse proxy, and point that one at the same services instead.
  proxy:
    image: caddy:${CADDY_VERSION:-2.10.2}
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      KRATER_DOMAIN: ${KRATER_DOMAIN:-}
      # *.localhost names keep a site unserved (Caddy's local CA, never Let's Encrypt): screenshots kept
      # with a hosted provider.
      KRATER_S3_DOMAIN: ${KRATER_S3_DOMAIN:-storage.localhost}
    # Checked here rather than with Compose's `${KRATER_DOMAIN:?}`, which would fail every
    # `docker compose` command, with or without this profile.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        : "$${KRATER_DOMAIN:?set KRATER_DOMAIN to the portal's public hostname}" &&
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - krater_caddy_data:/data
      - krater_caddy_config:/config
    depends_on:
      - portal

volumes:
  krater_db_data:
  krater_storage_data:
  krater_caddy_data:
  krater_caddy_config:
