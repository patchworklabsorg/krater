[project]
name = "krater-cli"
version = "0.2.0"
description = "The krater command: run jobs and boxes on Krater Compute (Project Ganymede, Patchwork Labs)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
krater = "krater_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krater_cli"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
