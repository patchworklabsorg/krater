[project]
name = "krater"
version = "0.1.0"
description = "Project Ganymede approval and compute allocation portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "authlib>=1.3",
    "httpx>=0.27",
    "procrastinate[psycopg]>=2.11",
    "pyyaml>=6.0",
    "slack-sdk>=3.27",
    "boto3>=1.43.103",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krater"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests talk to real running services (a local Weave, a real SkyPilot API server). They're skipped by default;
# run them with `uv run pytest -m live` once those services are up (see docs/dev/).
addopts = "-m 'not live'"
markers = ["live: needs real external services running; deselected by default"]
